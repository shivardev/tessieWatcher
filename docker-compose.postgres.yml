services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teslalog
      POSTGRES_USER: teslalog
      POSTGRES_PASSWORD: ${TESLALOG_POSTGRES_PASSWORD:?set in .env}
    volumes:
      - teslalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslalog -d teslalog"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: .
    image: teslalog:latest
    restart: unless-stopped
    command: ["postgres", "-addr", ":8085", "-id", "teslalog"]
    environment:
      TESLALOG_POSTGRES_DSN: postgres://teslalog:${TESLALOG_POSTGRES_PASSWORD}@postgres:5432/teslalog?sslmode=disable
      TESLALOG_SERVER_TOKEN: ${TESLALOG_SERVER_TOKEN:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/teslalog", "healthcheck", "-url", "http://127.0.0.1:8085/health"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 15s
    ports:
      - "8085:8085"

  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: teslalog
      PGUSER: teslalog
      PGPASSWORD: ${TESLALOG_POSTGRES_PASSWORD:?set in .env}
      RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-30}
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./backups/postgres:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          stamp=$$(date -u +%Y-%m-%dT%H%M%SZ)
          tmp=/backups/.teslalog-$${stamp}.dump.tmp
          final=/backups/teslalog-$${stamp}.dump
          pg_dump --format=custom --file="$${tmp}"
          mv "$${tmp}" "$${final}"
          find /backups -type f -name 'teslalog-*.dump' -mtime "+$${RETENTION_DAYS}" -delete
          sleep 86400
        done

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["public"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      server:
        condition: service_healthy

volumes:
  teslalog-postgres-data:
