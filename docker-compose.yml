# Optional Docker deployment (see README - the systemd/bare-binary path
# is the primary one for the Pi Zero 2 W; this is for anyone who'd
# rather run it as a container, on the Pi or anywhere else).
#
#   docker compose build
#   docker compose run --rm teslalog auth   # one-time interactive login
#   docker compose up -d
#   docker compose logs -f
services:
  teslalog:
    build: .
    image: teslalog:latest
    container_name: teslalog
    restart: unless-stopped
    volumes:
      - teslalog-data:/var/lib/teslalog
      - teslalog-config:/etc/teslalog
    # `command` defaults to `run` (see Dockerfile CMD). Override for
    # one-off commands, e.g.:
    #   docker compose run --rm teslalog status
    #   docker compose run --rm teslalog export drives -out /var/lib/teslalog/drives.csv

volumes:
  teslalog-data:
  # Seeded from the image's /etc/teslalog/config.toml on first run; edit it
  # in place afterwards (e.g. `docker compose exec teslalog` isn't
  # available - this image has no shell - so edit via
  # `docker run --rm -v teslalog_teslalog-config:/etc/teslalog -v "$PWD":/host alpine cp /host/config.toml /etc/teslalog/config.toml`,
  # or just recreate the volume from a local file before first `up`) and it
  # persists across `docker compose up --force-recreate` / image rebuilds.
  teslalog-config:
