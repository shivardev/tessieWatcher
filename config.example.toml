# TeslaLog Mini configuration.
# Copy to /etc/teslalog/config.toml and adjust as needed.
# Any field left out uses the built-in default shown here.

database   = "/var/lib/teslalog/tesla.db"
token_file = "/var/lib/teslalog/tokens.json"

# Optional: pin to one vehicle's VIN if your account has more than one.
# Leave blank to use the first vehicle returned by the account.
vin = ""

[polling]
# How often we call vehicle_data in each "awake" state. Defaults match
# TeslaMate's own published defaults (driving_interval/charging_interval/
# default_interval in vehicle.ex) so drive tracks have comparable
# position density - TeslaMate itself polls much faster while driving
# than while just sitting online idle.
driving_interval  = "2.5s"
charging_interval = "5s"
online_interval   = "15s"

# How long the car can sit online-but-idle (parked, not charging)
# before we stop polling at online_interval and switch to the much
# cheaper suspended_check_interval cadence instead. Matches TeslaMate's
# own car_settings.suspend_after_idle_min exactly (verified directly
# against its source, not guessed - an earlier version of this default
# here was wrong by 5x).
idle_timeout = "15m"

# How often we perform the cheap "is it awake yet" check
# (GET /api/1/vehicles, which never wakes the car) once suspended (see
# idle_timeout above) - deliberately slow, since leaving the car alone
# at that point is the whole point. Matches TeslaMate's own
# car_settings.suspend_min exactly.
suspended_check_interval = "21m"
# Same kind of cheap, non-waking check, but for ASLEEP/OFFLINE
# specifically - unlike the deliberate suspended state above, being
# asleep or offline carries no "leave it alone" reason for a slow
# interval (asleep just means the API confirms it's sleeping, which
# checking again doesn't disturb; offline just means the last check
# couldn't reach the car). Matches TeslaMate's own @asleep_interval
# exactly, which applies identically to both states.
asleep_interval = "30s"

# How long a drive can go OFFLINE (not ASLEEP - see the README) before
# it's considered abandoned and closed using its last known position,
# instead of staying open forever or silently absorbing a later,
# unrelated drive. Matches TeslaMate's own @drive_timeout_min exactly.
drive_timeout = "15m"

[streaming]
enabled = true
url     = "wss://streaming.vn.teslamotors.com/streaming/"

[backup]
enabled        = true
dir            = "/var/lib/teslalog/backups"
retention_days = 30
interval       = "24h"

[portal]
# On by default: a tiny read-only HTTP page (current state, today's
# drives, last charge, recent drives, recent log activity, and a
# "Download database" button that hands you a consistent snapshot of
# tesla.db - e.g. to open in Grafana via its SQLite datasource plugin).
# There is NO login. Set enabled = false if this box isn't on a network
# you trust, or is reachable from the public internet - anyone who can
# reach this address can download a complete log of everywhere the
# vehicle has been and when. Do not port-forward this address.
enabled = true
addr    = ":8083"
# "metric" (default) or "imperial" - only changes how this page
# displays distances (km vs mi). Every distance value in the database
# itself is always stored in km regardless of this setting, so
# changing it later never reinterprets existing data - it only changes
# what this page shows.
units   = "metric"

[geocoding]
# Off by default. If enabled, a drive/charge location that doesn't match
# any [[geofence]] below falls back to a reverse-geocoding HTTP lookup
# against an OSM Nominatim-compatible service (results are cached, so
# the same spot is never looked up twice). This sends that location's
# GPS coordinates to a third-party server - off by default for exactly
# that reason, even though it's the same thing TeslaMate itself does by
# default. See the README's Geofencing & locations section.
enabled = false
base_url = "https://nominatim.openstreetmap.org"
# Nominatim's usage policy requires a descriptive User-Agent (ideally
# with contact info) - see
# https://operations.osmfoundation.org/policies/nominatim/. If you make
# more than occasional personal-use requests, that policy asks you to
# self-host your own Nominatim instance instead and point base_url at it.
user_agent = "teslalog/0.2.0 (personal use)"

# Named zones, checked before any reverse-geocoding lookup - free (no
# network), and covers your most common places (home, work) without
# ever sending their coordinates anywhere. Add as many [[geofence]]
# blocks as you like; radius_m is required (no implicit default).
# When zones overlap, the NEAREST one wins, so a small "Home garage"
# inside a larger "Home" resolves to the garage regardless of the
# order they're listed in.
# [[geofence]]
# name     = "Home"
# lat      = 35.0000
# lng      = -85.0000
# radius_m = 50
#
# Geofences can also carry their own charging price, which is how
# per-location rates are expressed - electricity costs differ between
# home, a paid apartment charger, and a free one at a store, so a
# single global rate can't be right for all of them. A geofence's
# price always beats [charging].price_per_kwh below.
#
# cost_per_unit is required to enable pricing for a zone; 0 is a real
# value meaning "free" (distinct from omitting it, which means "cost
# unknown here"). billing_type is "per_kwh" (default) or "per_minute".
# session_fee is a flat amount added once per session.
# [[geofence]]
# name          = "Apartment charger"
# lat           = 36.1220
# lng           = -86.7746
# radius_m      = 50
# cost_per_unit = 0.30
# session_fee   = 0.45
#
# [[geofence]]
# name          = "Free charger at the store"
# lat           = 36.1288
# lng           = -86.7783
# radius_m      = 50
# cost_per_unit = 0

[api]
# These defaults are correct for the standard Tesla Owner API/SSO
# endpoints; only override for testing against a mock server.
owner_api_base_url = "https://owner-api.teslamotors.com"
sso_base_url        = "https://auth.tesla.com"
client_id            = "ownerapi"
user_agent           = "teslalog/0.2"

[vehicle]
# Wh/km consumption estimate - only a STARTING POINT. Not reported by
# the API, so teslalog begins with whatever you put here, then derives
# the real figure from your own charging history (the most-agreed-upon
# kWh-per-km across real charges) and overwrites this, exactly as
# TeslaMate does. So a rough guess, or 0, is fine: it self-corrects
# once there are enough real charges to be confident. Stored on the
# vehicle row for whatever reads the DB (Grafana, the frontend) to use
# in range projections.
efficiency_wh_km = 0

[charging]
# The Owner API only reports energy ADDED to the battery, not energy
# drawn from the wall. teslalog computes the real figure by
# integrating measured charger power over each session's samples, the
# same as TeslaMate. This efficiency factor is only a FALLBACK for
# sessions where no usable power readings exist
# (charge_energy_used_kwh = charge_energy_added_kwh / efficiency).
# Leave 0 to skip the fallback (column stays NULL in that case).
efficiency = 0

# Fallback charging rate, used only for charges that happen outside
# every priced [[geofence]] above - per-location pricing is set on the
# geofences themselves, since real rates differ by location. Applied
# to whichever is greater of energy added and energy drawn from the
# wall, matching TeslaMate. Leave 0 to record no cost for unpriced
# locations.
price_per_kwh = 0

# If true, any charge at a Tesla-branded fast charger (Supercharger)
# costs 0 regardless of every other pricing rule - for accounts with
# free supercharging included. Matches TeslaMate's own
# free_supercharging setting.
free_supercharging = false
